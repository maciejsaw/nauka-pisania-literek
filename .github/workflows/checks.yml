name: Checks and website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test && npm run check:metadata && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-test-results, path: test-results/ }
      - run: npm run screenshots
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: store-screenshots
          path: |
            store/ios/screenshots/
            store/android/metadata/pl-PL/images/phoneScreenshots/
            build/previews/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - run: bundle lock --add-platform arm64-darwin x86_64-darwin ruby
      - run: bundle exec fastlane lanes
      - run: bundle exec ruby tests/fastlane_test.rb
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - uses: actions/upload-artifact@v4
        with: { name: ruby-lockfile, path: Gemfile.lock }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-36 build-tools;36.0.0" }
      - run: npm ci && npm run sync
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: android-debug, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Create temporary QA signing key (never used for store releases)
        run: bash scripts/qa-android-key.sh
      - run: bash scripts/check-android-signing.sh
      - name: Exercise the actual Android release packaging lane
        env:
          APP_VERSION: '1.0.0'
          BUILD_NUMBER: '1000001'
        run: bundle exec fastlane android package
      - name: Verify the bundle signature
        run: |
          jarsigner -verify -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -strict build/android/Pajaczek.aab
      - if: always()
        run: rm -f "$RUNNER_TEMP/qa-only-upload.jks"

  ios:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci && npm run sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with: { name: ios-simulator, path: build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app }
      - name: Archive Release for real iOS devices (without Apple credentials)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/ios-release/Pajaczek.xcarchive CODE_SIGNING_ALLOWED=NO archive

  pages:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
