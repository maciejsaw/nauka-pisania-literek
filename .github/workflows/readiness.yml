name: Release readiness
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Co przygotowujesz? Raport niczego nie publikuje.'
        type: choice
        options: [bootstrap, beta, production]
        default: production
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Report missing settings without printing their values
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ vars.VITE_REVENUECAT_IOS_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          REVIEW_CONTACT_JSON: ${{ secrets.REVIEW_CONTACT_JSON }}
          STAGE: ${{ inputs.stage }}
        run: |
          args=(--publish)
          if [ "$STAGE" = bootstrap ]; then args=(--ci); fi
          if [ "$STAGE" = production ]; then args+=(--production); fi
          npm run doctor -- "${args[@]}" --report release-readiness.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: release-readiness.md
          retention-days: 14
