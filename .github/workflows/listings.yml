name: Prepare store listings
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-release
  cancel-in-progress: false
env:
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
jobs:
  listing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-26
          - platform: android
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Only use the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - run: npm ci && npm run check:metadata
      - run: bundle exec ruby tests/fastlane_test.rb
      - name: Restore Google access
        if: matrix.platform == 'android'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          value=os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'];json.loads(value)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'play-account.json'
          p.write_text(value);p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GOOGLE_PLAY_JSON_PATH='+str(p)+'\n')
          PY
      - name: Save descriptions and images, without submitting for review
        env:
          PLATFORM: ${{ matrix.platform }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane "$PLATFORM" listing
      - if: always() && matrix.platform == 'android'
        run: rm -f "$RUNNER_TEMP/play-account.json"
