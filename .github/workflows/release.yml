name: Release to stores
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Wersja paczek startowych, np. v1.0.0-beta.1 (bez publikacji)'
        required: true
        default: v1.0.0-beta.1
permissions:
  contents: read
concurrency:
  group: store-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  VITE_REVENUECAT_IOS_KEY: ${{ vars.VITE_REVENUECAT_IOS_KEY }}
  VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      ios-build: ${{ steps.version.outputs.ios_build }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - id: version
        run: npm run release:version
      - name: Check all store settings before building
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ vars.VITE_REVENUECAT_IOS_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          REVIEW_CONTACT_JSON: ${{ secrets.REVIEW_CONTACT_JSON }}
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$PUBLISH" = true ]; then
            npm run doctor -- --publish
          else
            npm run doctor -- --ci
          fi
      - run: npm run typecheck && npm test && npm run check:metadata && npm run build
      - name: Install browser test dependencies
        timeout-minutes: 10
        run: bash scripts/ci-browser-deps.sh
      - run: npm run test:ui
  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-36 build-tools;36.0.0" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          value=os.environ['KEYSTORE_BASE64']
          if not value: raise SystemExit('Brak ANDROID_KEYSTORE_BASE64 — docs/RELEASE-KROK-PO-KROKU.md')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'upload.jks'
          p.write_bytes(base64.b64decode(value)); p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('ANDROID_KEYSTORE_PATH='+str(p)+'\n')
          PY
      - run: bash scripts/check-android-signing.sh
      - run: npm ci && npm run sync
      - run: bundle exec fastlane android package
      - uses: actions/upload-artifact@v4
        with: { name: signed-android, path: build/android/Pajaczek.aab, retention-days: 14 }
      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
  ios:
    needs: validate
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Restore signing credentials
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib,secrets
          with open(os.environ['GITHUB_ENV'],'a') as env:
            for key,name,out in [('IOS_P12_BASE64','distribution.p12','IOS_P12_PATH'),('IOS_PROFILE_BASE64','app.mobileprovision','IOS_PROFILE_PATH')]:
              if not os.environ[key]: raise SystemExit('Brak '+key+' — docs/RELEASE-KROK-PO-KROKU.md')
              p=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              p.write_bytes(base64.b64decode(os.environ[key]));p.chmod(0o600)
              env.write(out+'='+str(p)+'\n')
            password=secrets.token_hex(24)
            print('::add-mask::'+password)
            env.write('KEYCHAIN_PASSWORD='+password+'\n')
          PY
      - run: python3 scripts/check-ios-signing.py
      - run: npm ci && npm run release:version && npm run sync
      - run: bundle exec fastlane ios package
      - uses: actions/upload-artifact@v4
        with: { name: signed-ios, path: build/ios/Pajaczek.ipa, retention-days: 14 }
      - if: always()
        run: |
          security delete-keychain pajaczek-ci || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision"
  publish-android:
    if: github.event_name == 'push'
    needs: [validate, android, ios]
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - uses: actions/download-artifact@v4
        with: { name: signed-android, path: build/android }
      - name: Restore Play API access
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          value=os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'];json.loads(value)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'play-account.json';p.write_text(value);p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GOOGLE_PLAY_JSON_PATH='+str(p)+'\n')
          PY
      - run: bundle exec fastlane android publish
      - if: always()
        run: rm -f "$RUNNER_TEMP/play-account.json"
  publish-ios:
    if: github.event_name == 'push'
    needs: [validate, android, ios]
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build }}
      IOS_BUILD_NUMBER: ${{ needs.validate.outputs.ios-build }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      REVIEW_CONTACT_JSON: ${{ secrets.REVIEW_CONTACT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - uses: actions/download-artifact@v4
        with: { name: signed-ios, path: build/ios }
      - run: bundle exec fastlane ios publish
  summary:
    if: always()
    needs: [validate, android, ios, publish-android, publish-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Release status
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('# Pajączek — wynik wydania\n\n')
            for name,item in json.loads(os.environ['RESULTS']).items():f.write(f"- {name}: {item['result']}\n")
            f.write('\nWysłanie do sklepu nie oznacza zatwierdzenia. Status oceny sprawdź w App Store Connect i Play Console. Tryb ręczny tylko przygotowuje paczki do pierwszej konfiguracji.\n')
          PY
